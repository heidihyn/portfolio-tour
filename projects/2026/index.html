<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Heidi's 2026 immersive game: an AI murder mystery, a hacking game, and a dance floor.">
<title>2026 · AI Murder Mystery &amp; Dance Floor · Heidi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  /* 2026 · AI murder mystery, hacker game, dance floor. Placeholder page in the portal's theme:
     a dark club, magenta and cyan neon, falling code, a red scan line. The full page comes later. */
  :root {
    color-scheme: dark;
    --night: #07060d;
    --magenta: #ff2fa8;
    --cyan: #2ff3ff;
    --alarm: #ff2040;
    --text: #e9e6f5;
    --display: "Syncopate", "Arial Black", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
    display: grid; place-items: center; padding: 32px 16px;
    font-family: var(--mono); color: var(--text); background: var(--night);
    background-image:
      linear-gradient(rgba(47, 243, 255, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 47, 168, 0.07) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  body::after {
    content: ""; position: fixed; left: 0; right: 0; height: 2px; top: 0;
    background: var(--alarm); box-shadow: 0 0 18px var(--alarm); opacity: 0.6;
    animation: scan 5s linear infinite; pointer-events: none;
  }
  @keyframes scan { to { transform: translateY(100vh); } }
  .terminal {
    width: min(580px, 100%); padding: 36px 30px 30px;
    border: 1px solid var(--magenta); border-radius: 6px;
    background: rgba(12, 8, 22, 0.88);
    box-shadow: 0 0 40px rgba(255, 47, 168, 0.25), inset 0 0 40px rgba(47, 243, 255, 0.06);
  }
  .eyebrow { font-size: 12px; letter-spacing: 0.25em; color: var(--cyan); margin: 0 0 14px; }
  .eyebrow::before { content: "> "; color: var(--magenta); }
  h1 { font-family: var(--display); font-size: clamp(20px, 4.6vw, 30px); line-height: 1.25; margin: 0 0 18px; text-shadow: 0 0 18px rgba(255, 47, 168, 0.6); text-wrap: balance; }
  p { line-height: 1.7; margin: 0 0 20px; color: rgba(233, 230, 245, 0.75); }
  .cursor { display: inline-block; width: 0.6em; height: 1.1em; vertical-align: -0.2em; background: var(--cyan); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  ul { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 0 0 28px; }
  li { font-size: 12px; padding: 5px 10px; border: 1px solid rgba(47, 243, 255, 0.5); color: var(--cyan); }
  a.back { display: inline-block; font-weight: 700; font-size: 13px; color: var(--night); background: var(--cyan); padding: 11px 18px; text-decoration: none; }
  a.back:hover { background: var(--magenta); color: var(--text); }
  a.back:focus-visible { outline: 2px solid var(--magenta); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { body::after, .cursor { animation: none; } }
</style>
</head>
<body>
  <main class="terminal">
    <p class="eyebrow">2026 · IMMERSIVE GAME</p>
    <h1>AI Murder Mystery &amp; Dance Floor</h1>
    <ul><li>AI murder mystery</li><li>Hacker game</li><li>Dance floor</li></ul>
    <p>Case file loading. The full story of this game is coming soon.<span class="cursor" aria-hidden="true"></span></p>
    <a class="back" href="../../#2026">← Back to the hallway</a>
  </main>
</body>
</html>
